baseURL = 'https://vishwa357.github.io/'
languageCode = 'en-us'
title = "Vishwa's Notes"
theme = 'Hextra'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true

[params]
  author = 'Vishwakant Mishra'
  description = 'Software Engineer — Games, AR, HMI'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  pluralizeListTitles = false

[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'Java'
    url = '/java/'
    weight = 2
  [[menu.main]]
    name = 'Spring'
    url = '/spring/'
    weight = 3
  [[menu.main]]
    name = 'Design Patterns'
    url = '/design-patterns/'
    weight = 4

[[cascade]]
  [cascade._target]
    path = "/java/**"
  [cascade.params]
    book_sort = "weight"

[[cascade]]
  [cascade._target]
    path = "/spring/**"
  [cascade.params]
    book_sort = "weight"


